name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # needed to post review comments

jobs:
  review:
    runs-on: code-review
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so before/base SHAs resolve

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install OCR
        run: npm install -g @alibaba-group/open-code-review

      - name: Run review
        id: ocr
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_USE_ANTHROPIC }}
          NO_COLOR: "1"
          TERM: dumb
        run: |
          # On a push to an existing PR (synchronize), review only what that
          # push changed (before..head). On open/reopen, review the full PR
          # diff against the base branch.
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event.action }}" = "synchronize" ] && [ "${{ github.event.before }}" != "$ZERO" ]; then
            FROM="${{ github.event.before }}"
          else
            FROM="origin/${{ github.event.pull_request.base.ref }}"
          fi
          echo "Reviewing $FROM -> ${{ github.event.pull_request.head.sha }}"

          ocr review \
            --from "$FROM" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --format json \
            --audience agent \
            --timeout 20 \
            > review.json || true
          # show it in the log for debugging
          cat review.json

      - name: Post inline review comments
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            let data;
            try {
              data = JSON.parse(fs.readFileSync('review.json', 'utf8'));
            } catch (e) {
              core.warning('Could not parse review.json: ' + e.message);
              return;
            }

            const comments = Array.isArray(data.comments) ? data.comments : [];
            const warnings = Array.isArray(data.warnings) ? data.warnings : [];
            const s = data.summary || {};

            // Note any files that could not be fully reviewed (timeouts, etc.)
            const warnNote = warnings.length > 0
              ? `\n\n⚠️ ${warnings.length} file(s) could not be fully reviewed (e.g. timeout). Results may be incomplete.`
              : '';

            const header = comments.length === 0
              ? '## 🤖 AI Code Review\n\n✅ No issues found in the reviewed changes.' + warnNote
              : `## 🤖 AI Code Review\n\nFound **${comments.length}** issue(s) across **${s.files_reviewed ?? '?'}** file(s).` + warnNote;

            // No issues: post a summary comment and stop
            if (comments.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: header,
              });
              return;
            }

            // Map OCR comments -> GitHub review comments
            const reviewComments = comments.map(c => {
              let body = c.content || '';
              if (c.suggestion_code) {
                body += '\n\n```suggestion\n' + c.suggestion_code + '\n```';
              }
              const start = c.start_line;
              const end = c.end_line ?? c.start_line;
              const comment = { path: c.path, line: end, side: 'RIGHT', body };
              if (start && end && end > start) {
                comment.start_line = start;
                comment.start_side = 'RIGHT';
              }
              return comment;
            });

            // Post inline; fall back to a single summary comment if GitHub
            // rejects (e.g. a comment lands on a line not in the diff).
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'COMMENT',
                body: header,
                comments: reviewComments,
              });
            } catch (e) {
              core.warning('Inline review failed, falling back to summary: ' + e.message);
              const lines = comments.map(c => {
                let b = `**${c.path}:${c.start_line}** — ${c.content}`;
                if (c.suggestion_code) {
                  b += '\n\n```php\n' + c.suggestion_code + '\n```';
                }
                return b;
              }).join('\n\n---\n\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: header + '\n\n' + lines,
              });
            }
