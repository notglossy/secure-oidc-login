name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # needed to post the review comment

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the diff resolves

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OCR
        run: npm install -g @alibaba-group/open-code-review

      - name: Run review
        id: ocr
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_USE_ANTHROPIC }}
        run: |
          # capture text output; don't fail the job if the review finds issues
          ocr review \
            --from "origin/${{ github.event.pull_request.base.ref }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --audience agent \
            | tee review.txt || true

      - name: Post review as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('review.txt', 'utf8').trim(); }
            catch (e) { body = ''; }

            if (!body) {
              console.log('No review output to post.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${body}`
            });
