coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 2%
    patch:
      default:
        target: 80%

ignore:
  - "vendor/**/*"
  - "tests/**/*"
  - "build/**/*"
  - "secure-oidc-login.php"  # Bootstrap file with initialization code - tested via integration tests

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
